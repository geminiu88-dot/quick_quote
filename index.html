<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>报价查询</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="报价查询">
<meta name="theme-color" content="#1f5f8b">
<style>
  :root { --blue: #1f5f8b; --bg: #f3f5f7; --line: #d9dee3; --muted: #6b7682; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #1d2329;
         font: 16px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--blue); color: #fff;
           padding: 10px 12px calc(10px); padding-top: max(10px, env(safe-area-inset-top)); }
  .bar { display: flex; gap: 8px; }
  #q { flex: 1; min-width: 0; font-size: 20px; padding: 10px 12px; border: 0; border-radius: 8px;
       text-transform: uppercase; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 10px 14px; background: #fff;
           color: var(--blue); font-weight: 600; }
  #info { font-size: 12px; opacity: .85; margin-top: 6px; display: flex; justify-content: space-between; gap: 8px; }
  #info a { color: #fff; }
  main { padding: 12px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .style { font-size: 24px; font-weight: 700; }
  .client { font-size: 18px; color: var(--muted); }
  .tag { display: inline-block; background: #fde7dc; color: #b23c00; border-radius: 6px;
         padding: 1px 8px; font-size: 14px; margin-left: 6px; font-weight: 600; }
  .prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .price { background: #eef4f9; border-radius: 8px; padding: 8px; text-align: center; }
  .price b { display: block; font-size: 26px; color: var(--blue); }
  .price span { font-size: 11px; color: var(--muted); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  h3 { font-size: 14px; color: var(--muted); font-weight: 400; margin: 18px 0 6px;
       display: flex; justify-content: space-between; }
  h3 a { color: var(--muted); }
  .mini { display: grid; grid-template-columns: 1fr auto repeat(3, 3.2em); gap: 6px; align-items: baseline;
          width: 100%; text-align: left; background: #fff; border: 1px solid var(--line);
          color: #1d2329; font-weight: 400; padding: 8px 10px; margin-bottom: 4px; border-radius: 8px; }
  .mini b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mini span { color: var(--muted); font-size: 14px; }
  .mini i { font-style: normal; text-align: right; color: var(--blue); font-weight: 600; }
  .mini em { grid-column: 1 / -1; font-style: normal; color: #b23c00; font-size: 14px; }
  .quote { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .quote label { color: var(--muted); white-space: nowrap; }
  .quote input { flex: 1; min-width: 0; font: inherit; padding: 8px 10px;
                 border: 1px solid var(--line); border-radius: 8px; }
  .list button { display: block; width: 100%; text-align: left; margin-bottom: 6px;
                 border: 1px solid var(--line); color: #1d2329; font-weight: 400; }
  .empty { text-align: center; color: var(--muted); margin-top: 40px; }
  #scan { position: fixed; inset: 0; background: #000; z-index: 5; display: none; }
  #scan video { width: 100%; height: 100%; object-fit: cover; }
  #scan .frame { position: absolute; left: 8%; right: 8%; top: 38%; height: 24%;
                 border: 3px solid #fff; border-radius: 12px; }
  #scan button { position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); left: 50%;
                 transform: translateX(-50%); }
  #scan p { position: absolute; top: 15%; width: 100%; text-align: center; color: #fff; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <input id="q" type="search" placeholder="输入货号" autocomplete="off" autocapitalize="characters">
    <button id="scanBtn">扫码</button>
  </div>
  <div id="info"><span id="dataInfo">还没有数据</span><a href="#" id="importLink">导入Excel</a></div>
  <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden>
</header>
<main id="out"></main>
<div id="scan">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <p>把条码放进框里</p>
  <button id="stopBtn">取消</button>
</div>

<script src="lib/xlsx.full.min.js"></script>
<script src="lib/zbar.js"></script>
<script>
// All data stays on this phone: the Excel is read here and kept in localStorage.
// Columns are found by their title text, so the sheet's column order can change.
var STORE = 'fair-data';
var KEY_TITLE = '货号';                    // the column with our style no
var PRICE_MARK = /\d\.\d\s*$/;             // price columns end in an exchange rate, e.g. "...6.5"
var CHEAP_TITLE = '低价';
var HISTORY = 'fair-history';           // style nos looked up before, newest first
var MAX_HISTORY = 50;

var data = load();   // {file, when, titles: [...], rows: [[...], ...]}
var out = document.getElementById('out');
var q = document.getElementById('q');

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; }
}

var past = [];
try { past = JSON.parse(localStorage.getItem(HISTORY)) || []; } catch (e) { past = []; }

function clean(s) { return String(s == null ? '' : s).replace(/\s+/g, ''); }
function norm(s) { return clean(s).toUpperCase(); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c];
  });
}
function col(text) {
  if (!data) return -1;
  for (var i = 0; i < data.titles.length; i++) if (data.titles[i].indexOf(text) >= 0) return i;
  return -1;
}

// --- import ---------------------------------------------------------------
document.getElementById('importLink').onclick = function (e) {
  e.preventDefault(); document.getElementById('file').click();
};
document.getElementById('file').onchange = function () {
  var f = this.files[0]; if (!f) return;
  out.innerHTML = '<p class="empty">正在读取…</p>';
  f.arrayBuffer().then(function (buf) {
    var book = XLSX.read(buf, {type: 'array'});
    var sheet = book.Sheets[book.SheetNames[0]];
    var grid = XLSX.utils.sheet_to_json(sheet, {header: 1, raw: false, defval: ''});
    var head = grid.findIndex(function (r) { return r.some(function (c) { return clean(c).indexOf(KEY_TITLE) >= 0; }); });
    if (head < 0) throw new Error('第一张表里找不到「' + KEY_TITLE + '」这一列');
    var titles = grid[head].map(clean);
    var k = titles.findIndex(function (t) { return t.indexOf(KEY_TITLE) >= 0; });
    var rows = grid.slice(head + 1).filter(function (r) { return clean(r[k]); })
                   .map(function (r) { return r.map(function (c) { return String(c).trim(); }); });
    var fresh = {file: f.name, when: new Date().toLocaleString('zh-CN'), titles: titles, rows: rows};
    try { localStorage.setItem(STORE, JSON.stringify(fresh)); }
    catch (e) { alert('手机存储空间不够，这次导入只在页面打开时有效'); }
    data = fresh; showInfo(); show('');
    out.innerHTML = '<p class="empty">已导入 ' + rows.length + ' 行</p>';
  }).catch(function (err) {
    out.innerHTML = '<p class="empty">读取失败：' + esc(err.message) + '</p>';
  });
  this.value = '';
};

function showInfo() {
  document.getElementById('dataInfo').textContent = data
    ? data.rows.length + ' 行 · ' + data.file + ' · ' + data.when : '还没有数据，请先导入Excel';
}

// --- search ---------------------------------------------------------------
q.oninput = function () { show(q.value); };

function show(text) {
  var s = norm(text);
  if (!data) { out.innerHTML = '<p class="empty">先点右上角「导入Excel」，选公司导出的表</p>'; return; }
  if (!s) {
    out.innerHTML = (past.length ? '' : '<p class="empty">输入货号，或点「扫码」</p>') + pastList('');
    return;
  }
  var k = col(KEY_TITLE);
  var exact = data.rows.filter(function (r) { return norm(r[k]) === s; });
  if (exact.length) {
    remember(s);
    out.innerHTML = exact.map(card).join('') + pastList(s);
    return;
  }
  var seen = {}, near = [];
  data.rows.forEach(function (r) {
    var v = norm(r[k]);
    if (v.indexOf(s) >= 0 && !seen[v]) { seen[v] = 1; near.push(r[k]); }
  });
  if (!near.length) { out.innerHTML = '<p class="empty">没有找到 ' + esc(s) + '</p>'; return; }
  out.innerHTML = '<div class="list">' + near.slice(0, 30).map(function (v) {
    return '<button onclick="pick(this.textContent)">' + esc(v) + '</button>';
  }).join('') + '</div>';
}
function pick(v) { q.value = v; show(v); window.scrollTo(0, 0); }

// --- past lookups: one short row per Excel row (style no, client, prices) ---
function remember(s) {
  past = [s].concat(past.filter(function (h) { return h !== s; })).slice(0, MAX_HISTORY);
  try { localStorage.setItem(HISTORY, JSON.stringify(past)); } catch (e) { /* not kept */ }
}
function forget() {
  past = [];
  try { localStorage.removeItem(HISTORY); } catch (e) { /* nothing */ }
  show(q.value);
}
// What we actually quoted, typed on the card, by row number. Only kept while
// the app is open (owner: it is just to write down later).
var quoted = {};
function setQuote(i, v) { quoted[i] = v; }

function pastList(current) {
  var k = col(KEY_TITLE), client = col('客人'), prices = priceCols();
  var html = '';
  past.forEach(function (h) {
    if (h === current) return;
    data.rows.forEach(function (r, n) {
      if (norm(r[k]) !== h) return;
      html += '<button class="mini" onclick="pick(\'' + esc(r[k]).replace(/'/g, '') + '\')"><b>' + esc(r[k]) + '</b>' +
        '<span>' + (client >= 0 ? esc(r[client]) : '') + '</span>' +
        prices.map(function (i) { return '<i>' + esc(r[i] || '—') + '</i>'; }).join('') +
        (quoted[n] ? '<em>报价：' + esc(quoted[n]) + '</em>' : '') + '</button>';
    });
  });
  return html ? '<h3>查过的<a href="#" onclick="forget(); return false">清空</a></h3>' + html : '';
}
function priceCols() {
  var list = [];
  data.titles.forEach(function (t, i) { if (PRICE_MARK.test(t)) list.push(i); });
  return list;
}

function card(r) {
  var n = data.rows.indexOf(r);
  var k = col(KEY_TITLE), client = col('客人'), cheap = col(CHEAP_TITLE);
  var used = [k, client, cheap];
  var prices = priceCols(), rest = [];
  data.titles.forEach(function (t, i) {
    if (used.indexOf(i) < 0 && prices.indexOf(i) < 0 && t) rest.push(i);
  });
  var cheapTag = cheap >= 0 && r[cheap] && r[cheap] !== '0' ? '<span class="tag">低价客</span>' : '';
  var row = function (i) { return '<dt>' + esc(data.titles[i]) + '</dt><dd>' + esc(r[i] || '—') + '</dd>'; };
  return '<div class="card">' +
    '<div class="top"><span class="style">' + esc(r[k]) + '</span>' +
    '<span class="client">' + (client >= 0 ? esc(r[client]) : '') + cheapTag + '</span></div>' +
    '<div class="prices">' + prices.map(function (i) {
      return '<div class="price"><b>' + esc(r[i] || '—') + '</b><span>' + esc(data.titles[i]) + '</span></div>';
    }).join('') + '</div>' +
    '<dl>' + rest.map(row).join('') + '</dl>' +
    '<div class="quote"><label>实际报价</label><input type="text" placeholder="例如 2.10 / 3000双" value="' +
      esc(quoted[n] || '') + '" oninput="setQuote(' + n + ', this.value)"></div>' +
    '</div>';
}

// --- barcode scanning -------------------------------------------------------
// Sample barcodes hold "style no~client" (or the other way round). QR codes work
// too. Android Chrome has a built-in reader (BarcodeDetector); when it finds
// nothing, and on iPhone, we use ZBar (lib/zbar.js, the zbar-wasm package).
// Held at a slant, labels often fail, so each frame is also tried turned a
// little (tested on a real photo: bars 20° off read only after turning).
var video = document.getElementById('video'), scanBox = document.getElementById('scan');
var stream = null, canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently: true});
var FORMATS = ['code_128', 'code_39', 'code_93', 'codabar', 'ean_13', 'ean_8', 'upc_a', 'itf', 'qr_code'];
var ANGLES = [0, 15, -15, 30, -30];   // degrees; one per frame, in turn
var native = null, frameNo = 0;
if ('BarcodeDetector' in window) {
  try { native = new BarcodeDetector({formats: FORMATS}); } catch (e) { native = null; }
}

document.getElementById('scanBtn').onclick = function () {
  if (!navigator.mediaDevices) { alert('这个浏览器不能用摄像头，请用 Safari 或 Chrome 打开'); return; }
  navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: 1280}}}).then(function (s) {
    stream = s; video.srcObject = s; scanBox.style.display = 'block';
    video.play(); setTimeout(tick, 200);
  }).catch(function () { alert('没有摄像头权限'); });
};
document.getElementById('stopBtn').onclick = stopScan;

function stopScan() {
  if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
  stream = null; scanBox.style.display = 'none';
}
function found(text) { if (stream) { stopScan(); pick(styleFrom(text)); } }
function again() { if (stream) setTimeout(tick, 60); }

function tick() {
  if (!stream) return;
  if (video.readyState < video.HAVE_ENOUGH_DATA) { setTimeout(tick, 150); return; }
  frameNo++;
  var first = native ? native.detect(video).then(function (c) { return c.length ? c[0].rawValue : null; })
                     : Promise.resolve(null);
  first.catch(function () { return null; }).then(function (text) {
    return text || withZbar();
  }).then(function (text) {
    if (text) found(text); else again();
  }).catch(again);
}

// Draw the camera picture turned by this frame's angle, at most 800 px wide.
function withZbar() {
  var vw = video.videoWidth, vh = video.videoHeight, k = Math.min(1, 800 / Math.max(vw, vh));
  var w = Math.round(vw * k), h = Math.round(vh * k), a = ANGLES[frameNo % ANGLES.length] * Math.PI / 180;
  canvas.width = w; canvas.height = h;
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h);
  ctx.save(); ctx.translate(w / 2, h / 2); ctx.rotate(a);
  ctx.drawImage(video, -w / 2, -h / 2, w, h); ctx.restore();
  var img = ctx.getImageData(0, 0, w, h);
  return zbarWasm.scanImageData(img).then(function (codes) {
    if (codes.length) return codes[0].decode();
    return frameNo % 2 ? null : throughStaple(img);
  });
}

// Samples get stapled over their barcode. A slanted staple hides each column
// of the bars in only a few rows, so for every strip of 32 rows (middle part
// of the picture) we take the middle (median) brightness of each column: the
// staple drops out and the bar underneath is left. Then that clean line is read.
// A staple running straight down the bars can't be fixed: type the 货号 instead.
function throughStaple(img) {
  var w = img.width, h = img.height, px = img.data, WIN = 32, ROWS = 8;
  var col = new Uint8Array(WIN), line = new Uint8Array(w * ROWS), tries = [];
  for (var top = Math.round(h * 0.25); top + WIN <= h * 0.75; top += 8) {
    for (var x = 0; x < w; x++) {
      for (var j = 0; j < WIN; j++) {
        var i = 4 * ((top + j) * w + x);
        col[j] = (px[i] * 77 + px[i + 1] * 150 + px[i + 2] * 29) >> 8;
      }
      col.sort();
      for (var r = 0; r < ROWS; r++) line[r * w + x] = col[WIN >> 1];
    }
    tries.push(zbarWasm.scanGrayBuffer(line.slice(), w, ROWS));
  }
  return Promise.all(tries).then(function (all) {
    for (var t = 0; t < all.length; t++) if (all[t].length) return all[t][0].decode();
    return null;
  });
}

function styleFrom(text) {
  var m = /[?&]s=([^&#]+)/.exec(text);
  var s = m ? decodeURIComponent(m[1]) : text;
  // Sample barcodes join style no and client with ~ (835504~TU), sometimes the
  // other way round (TU~835504). Drop parts with fewer than 3 digits (the client).
  var parts = s.split('~').map(function (p) { return p.trim(); });
  var keep = parts.filter(function (p) { return (p.match(/\d/g) || []).length >= 3; });
  return keep.length ? keep[0] : parts[0];
}

// --- start ------------------------------------------------------------------
showInfo();
var start = /[?&]s=([^&#]+)/.exec(location.search);
if (start) pick(decodeURIComponent(start[1])); else show('');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
